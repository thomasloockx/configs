#cloud-config

# Hetzner Cloud-Init Configuration
# Usage: Paste this in the "Cloud config" field when creating a new server

# Disable root login
disable_root: true

# Create user
users:
  - name: thomas
    groups: sudo, docker
    shell: /bin/zsh
    sudo: ALL=(ALL) NOPASSWD:ALL
    # Direct key (guaranteed to work)
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKDtOBhUQUgqzm7XmMmK690B+riFhkil9/DUzdhLW9sZ tloockx-work-laptop
    # Also import from GitHub
    ssh_import_id:
      - gh:thomasloockx

# Update and upgrade packages on first boot
package_update: true
package_upgrade: true

# Install packages
packages:
  - git
  - zsh
  - tmux
  - curl
  - wget
  - htop
  - unzip
  - build-essential
  - fail2ban
  - ufw
  - neovim
  - ripgrep
  - fd-find
  - fzf
  - jq
  - docker.io
  - python3-pip
  - nodejs
  - npm

# SSH hardening
write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      ChallengeResponseAuthentication no
      UsePAM yes
      X11Forwarding no
      MaxAuthTries 3
    permissions: "0644"

# Commands to run on first boot
runcmd:
  # Enable and configure firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ssh
  - ufw --force enable

  # Enable fail2ban
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Restart SSH to apply hardening
  - systemctl restart sshd

  # Clone configs repo
  - su - thomas -c 'git clone https://github.com/thomasloockx/configs.git ~/configs'

  # Install oh-my-zsh for thomas
  - su - thomas -c 'sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended'

  # Symlink configs (after oh-my-zsh so we can overwrite .zshrc)
  - su - thomas -c 'mkdir -p ~/.config'
  - su - thomas -c 'ln -sf ~/configs/nvim ~/.config/nvim'
  - su - thomas -c 'ln -sf ~/configs/tmux/tmux.conf ~/.tmux.conf'
  - su - thomas -c 'ln -sf ~/configs/ohmyzsh/zshrc ~/.zshrc'

  # Install Claude Code CLI for thomas
  - su - thomas -c 'curl -fsSL https://claude.ai/install.sh | bash'

  # Set zsh as default (belt and suspenders)
  - chsh -s /bin/zsh thomas

# Final message
final_message: "Cloud-init completed after $UPTIME seconds"
